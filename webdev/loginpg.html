<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center h-screen">

    <div class="bg-white p-8 rounded-lg shadow-md w-80">

        <h1 class="text-xl font-bold mb-4 text-center">Login</h1>

        <form>
            <label for="email" class="block mb-1">Email</label>
            <input type="email" id="email" class="w-full border rounded px-3 py-2 mb-4">

            <label for="password" class="block mb-1">Password</label>
            <input type="password" id="password" class="w-full border rounded px-3 py-2 mb-4">

            <button type="submit" class="w-full bg-blue-500 text-white py-2 rounded hover:bg-blue-600">
                Log In
            </button>
        </form>

        <p class="text-center text-sm mt-4">
            Don't have an account? <a
                href="https://support.google.com/accounts/answer/27441?hl=en&co=GENIE.Platform%3DDesktop"
                class="text-blue-500">Sign up</a>
        </p>

    </div>

</body>

</html>
